[project]
name = "noar"
version = "0.1.0"
description = "NoAr: website and API uptime monitor"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.143.2",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.0",
    "pydantic[email]>=2.14.1",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/noar"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: FastAPI's dependency injection relies on Depends(...) as an argument
# default; that's the framework's own idiom, not the mutable-default bug the
# rule is meant to catch.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole session: lets the DB engine fixture be
# session-scoped too, so asyncpg isn't opening/closing a new physical
# connection for every single test (flaky on Windows otherwise).
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]
